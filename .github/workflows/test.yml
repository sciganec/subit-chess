name: SUBIT-CHESS tests

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run test:cpu
      - run: npm run test:chess-unit
      - run: npm run test:chess-machine
      - run: npm test
