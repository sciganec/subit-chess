name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel in-flight runs for same ref (except tags — those must complete)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  ENGINE_HTML: src/subit_chess_v3.0.5.html

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build is deterministic — the shipped HTML matches the modules
  # ---------------------------------------------------------------------------
  build:
    name: Build check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '20', '22' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify engine sources exist
        run: |
          for f in src/engine/index.mjs src/engine/search.mjs src/engine/evaluate.mjs build/bundle.mjs build/shell.html; do
            if [ ! -f "$f" ]; then
              echo "::error::$f not found"
              exit 1
            fi
          done
          ls -la src/engine/

      - name: Rebuild and fail on drift
        run: |
          cp "$ENGINE_HTML" /tmp/before.html
          npm run build
          if ! cmp -s /tmp/before.html "$ENGINE_HTML"; then
            echo "::error::npm run build produced a different artifact than the committed $ENGINE_HTML"
            diff <(head -c 2000 /tmp/before.html) <(head -c 2000 "$ENGINE_HTML") || true
            exit 1
          fi
          cmp -s "$ENGINE_HTML" index.html || {
            echo "::error::index.html is not a copy of $ENGINE_HTML"
            exit 1
          }
          echo "build OK: $(sha256sum "$ENGINE_HTML" | cut -d' ' -f1)"

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: subit-chess-html-node${{ matrix.node }}
          path: ${{ env.ENGINE_HTML }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. Engine test suite: perft, smoke, plans, eval, verify, driver, learn
  # ---------------------------------------------------------------------------
  test-engine:
    name: Engine tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --no-audit --no-fund

      - name: Run engine suite
        run: npm run test:engine

  # ---------------------------------------------------------------------------
  # 3. UI smoke test (jsdom) against the built single-file app
  # ---------------------------------------------------------------------------
  test-app:
    name: UI smoke (jsdom)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --no-audit --no-fund

      - name: Run UI test
        run: npm run test:app

  # ---------------------------------------------------------------------------
  # 4. Harness smoke — a short deterministic match must produce a report
  # ---------------------------------------------------------------------------
  match-smoke:
    name: Match harness smoke
    runs-on: ubuntu-latest
    needs: test-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --no-audit --no-fund

      - name: Play 4 games
        run: |
          node bench/match.mjs --a base --b plain --games 4 --depth 3 --seed 7 \
            --out results/smoke.json --quiet

      - name: Verify report
        run: |
          node -e "
            const r = require('./results/smoke.json');
            const s = r.summary.a;
            if (!s || typeof s.score !== 'number' || typeof s.ci95 !== 'number') {
              console.error('unexpected summary:', r.summary);
              process.exit(1);
            }
            if (r.games.length !== 4) {
              console.error('expected 4 games, got', r.games.length);
              process.exit(1);
            }
            const bad = r.games.filter(g => g.error);
            if (bad.length) {
              console.error('illegal moves:', bad);
              process.exit(1);
            }
            console.log('match OK: score=' + s.score.toFixed(3) +
              ' ci95=' + s.ci95.toFixed(3) +
              ' W' + s.wins + '/D' + s.draws + '/L' + s.losses);
          "

      - name: Upload match report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-smoke-report
          path: results/smoke.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 5. Release — only on tag push, after all gates pass
  # ---------------------------------------------------------------------------
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: [ build, test-engine, test-app, match-smoke ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --no-audit --no-fund

      - name: Extract changelog for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag version: $TAG"
          if [ -f CHANGELOG.md ]; then
            # NOTE: use index() for the tag match -- "[3.0.0]" as a regex is a
            # character class and would match the first line containing 3, . or 0.
            awk -v tag="[$TAG]" '
              index($0, tag) { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > /tmp/changelog.md
            if [ ! -s /tmp/changelog.md ]; then
              echo "_(no changelog section for $TAG — see README)_" > /tmp/changelog.md
            fi
          else
            echo "_(no CHANGELOG.md — see README)_" > /tmp/changelog.md
          fi
          cat /tmp/changelog.md

      - name: Compute checksum
        id: hash
        run: |
          HASH=$(sha256sum "$ENGINE_HTML" | cut -d' ' -f1)
          echo "sha256=$HASH" >> $GITHUB_OUTPUT
          echo "SHA256: $HASH"

      - name: Append verification info
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "**Engine artifact:** \`$(basename $ENGINE_HTML)\`"
            echo ""
            echo "**SHA256:** \`${{ steps.hash.outputs.sha256 }}\`"
            echo ""
            echo "**Verify:**"
            echo '```bash'
            echo "sha256sum $(basename $ENGINE_HTML)"
            echo '```'
            echo ""
            echo "**Quick start:** open the HTML in a browser — no server, no network."
            echo ""
            echo "**Tests:** \`npm run test:engine\` · \`npm run test:app\`"
            echo "**Ablation harness:** \`node bench/match.mjs --list\`"
            echo ""
            echo "**Architecture decisions:** see [\`docs/DECISIONS.md\`](docs/DECISIONS.md)"
            echo "**Roadmap:** see [\`docs/ROADMAP.md\`](docs/ROADMAP.md)"
            echo "**User manual:** see [\`docs/USER-MANUAL.md\`](docs/USER-MANUAL.md)"
          } >> /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SUBIT-CHESS ${{ github.ref_name }}
          body_path: /tmp/changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            ${{ env.ENGINE_HTML }}
          fail_on_unmatched_files: true