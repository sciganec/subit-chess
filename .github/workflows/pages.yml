name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'src/subit_chess_v3.0.0.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp src/subit_chess_v3.0.0.html _site/index.html
          cp src/subit_chess_v3.0.0.html _site/subit_chess_v3.0.0.html
          cat > _site/README.html <<'HTML'
          <!DOCTYPE html>
          <html lang="uk">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>subit-chess v3.0.0</title>
            <style>
              body{font-family:system-ui,sans-serif;background:#302e2b;color:#e8e6e3;
                   padding:2rem;max-width:44rem;margin:0 auto;line-height:1.55}
              a{color:#81b64c}
              code{background:#1a1a1a;padding:2px 6px;border-radius:4px}
              .btn{display:inline-block;margin-top:1.5rem;padding:.7rem 1.2rem;
                   background:#81b64c;color:#14260a;font-weight:700;border-radius:8px;
                   text-decoration:none}
            </style>
          </head>
          <body>
            <h1>subit-chess v3.0.0</h1>
            <p>Шаховий рушій у браузері: структурна функція оцінки (SVF),
               структурні плани, бюджетований альфа-бета пошук. Один HTML-файл,
               без мережі та без збірки.</p>
            <p><a class="btn" href="./subit_chess_v3.0.0.html">Грати</a></p>
            <p>Джерело та документація:
               <a href="https://github.com/sciganec/subit-chess">github.com/sciganec/subit-chess</a></p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4